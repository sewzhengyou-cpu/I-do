<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中马夫妻恋爱合同 ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",sans-serif;
}

body{
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:90%;
max-width:700px;
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.2);
text-align:center;
position:relative;
}

h1{
color:#ff4d6d;
margin-bottom:20px;
}

.contract{
text-align:left;
line-height:2;
font-size:18px;
margin:25px 0;
}

.btns{
margin-top:40px;
position:relative;
height:120px;
}

button{
padding:15px 40px;
font-size:20px;
border:none;
border-radius:40px;
cursor:pointer;
transition:.3s;
}

#yes{
background:#ff4d6d;
color:white;
}

#yes:hover{
transform:scale(1.1);
}

#no{
background:#999;
color:white;
position:absolute;
left:65%;
top:0;
}

#vow{
display:none;
animation:fade 1s;
}

#vow h2{
color:#ff4d6d;
margin-bottom:20px;
}

#vow p{
font-size:22px;
line-height:2;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* 爱心 */
.heart{
position:fixed;
top:-20px;
color:red;
font-size:20px;
animation:fall linear forwards;
pointer-events:none;
}

@keyframes fall{
to{
transform:translateY(110vh);
opacity:0;
}
}
</style>

</head>
<body>

<div class="container">

<div id="page1">

<h1>❤️ 中马夫妻恋爱合同 ❤️</h1>

<div class="contract">

本人自愿签署以下恋爱合同：

📌 第一条：以后不准轻易说分开。<br>

📌 第二条：吵架可以，但不能冷战太久。<br>

📌 第三条：中国老婆负责可爱。<br>

📌 第四条：马来西亚老公负责宠一辈子。<br>

📌 第五条：遇到困难，一起面对。<br>

📌 第六条：余生，请多指教。❤️

</div>

<h2>老婆，你愿意签署这份合同吗？🥺</h2>

<div class="btns">

<button id="yes">
❤️ 我愿意
</button>

<button id="no">
🙅 不愿意
</button>

</div>

</div>

<div id="vow">

<h2>❤️ 合同正式生效 ❤️</h2>

<p>

从今天开始，

你就是我的唯一。

无论中国还是马来西亚，

距离不会阻挡我们。

未来的每一天，

我都会陪着你，

宠着你，

照顾你。

愿往后的余生，

只有你，

一直都是你。

❤️ 我爱你 ❤️

</p>

</div>

</div>

<script>

const no=document.getElementById("no");
const yes=document.getElementById("yes");

no.addEventListener("mouseover",move);

no.addEventListener("click",()=>{
alert("😂 你点错了脑婆！");
move();
});

function move(){

const x=Math.random()*500;
const y=Math.random()*80;

no.style.left=x+"px";
no.style.top=y+"px";

}

yes.onclick=()=>{

document.getElementById("page1").style.display="none";

document.getElementById("vow").style.display="block";

setInterval(createHeart,250);

}

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*20)+"px";

heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

}

</script>

</body>
</html>
